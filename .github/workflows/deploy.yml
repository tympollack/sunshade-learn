name: Deploy SunShade Learn (Blueprint Academy)

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  verify-and-deploy:
    name: Verify & Deploy Cloudflare Worker with Static Assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Compiler Verification
        run: npx tsc --noEmit

      - name: Run Test Suite
        run: npm test

      - name: Build Static Assets & Bundle
        run: npm run build

      - name: Check Cloudflare Secret Configuration
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning title=Missing Cloudflare API Token::CLOUDFLARE_API_TOKEN is not configured in repository secrets. Verification passed, but automated edge deployment is skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub Settings -> Secrets -> Actions to enable CI/CD deployment."

      - name: Deploy to Cloudflare Workers (Staging)
        id: deploy_staging
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')) && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging

      - name: Deploy to Cloudflare Workers (Production)
        id: deploy_production
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')) && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

      - name: Post-Deploy Smoke Test (/api/health)
        if: steps.deploy_staging.outcome == 'success' || steps.deploy_production.outcome == 'success'
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ inputs.environment }}" = "production" ]; then
            TARGET_HOST="https://learn.sunshade.icu"
          else
            TARGET_HOST="https://learn-stag.sunshade.icu"
          fi
          echo "Verifying health endpoint at $TARGET_HOST/api/health..."
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --retry 6 --retry-delay 5 --retry-connrefused "$TARGET_HOST/api/health")
          echo "HTTP response status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Smoke test verification failed: expected HTTP 200, received $STATUS"
            exit 1
          fi
          echo "Smoke test passed successfully: $TARGET_HOST/api/health is live and healthy."
